<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    
    <defs>
        <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#040711"/>
            <stop offset="50%" stop-color="#070b18"/>
            <stop offset="100%" stop-color="#02040a"/>
        </linearGradient>
        <linearGradient id="blue_btn_grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
        <linearGradient id="flow_btn_grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
        <linearGradient id="asmr_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#022c22" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="pov_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#581c87" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#2e1065" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="sejarah_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#78350f" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#451a03" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="edukasi_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#172554" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="card_shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
        <filter id="glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <rect width="1920" height="1080" fill="url(#bg_grad)"/>
    
    <!-- Application Header Container -->
    <rect x="0" y="0" width="1920" height="174" fill="#050814"/>
    <line x1="0" y1="174" x2="1920" y2="174" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Left Logo & Branding -->
    <g transform="translate(80, 26)">
        <circle cx="30" cy="30" r="26" fill="#090e1e" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="30" cy="30" r="20" fill="#1e1b4b"/>
        <text x="30" y="36" text-anchor="middle" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold">RIA</text>
        <text x="74" y="24" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800" letter-spacing="0.5">CREATIVE STUDIO</text>
        <text x="74" y="46" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400">Create What Reality Cannot.</text>
    </g>

    <!-- Right Header Action Controls -->
    <g transform="translate(1380, 26)">
        <rect x="0" y="0" width="126" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="44" y="26" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Project ▾</text>

        <rect x="142" y="0" width="168" height="42" rx="10" fill="url(#blue_btn_grad)"/>
        <text x="226" y="26" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">🔖 Buka Flow ↗</text>

        <rect x="326" y="0" width="150" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="401" y="26" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">📥 Import Flow</text>
    </g>

    
            <g transform="translate(80, 108)">
                <rect width="82" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="41" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Home</text>
            </g>
            
            <g transform="translate(176, 108)">
                <rect width="137" height="42" rx="21" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.8"/>
                <circle cx="20" cy="21" r="4.5" fill="#38bdf8"/>
                <text x="34" y="26" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Character</text>
            </g>
            
            <g transform="translate(327, 108)">
                <rect width="115" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="57" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Viral 🔥</text>
            </g>
            
            <g transform="translate(456, 108)">
                <rect width="148" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="74" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Storyboard</text>
            </g>
            
            <g transform="translate(618, 108)">
                <rect width="192" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="96" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Image to Video</text>
            </g>
            
            <g transform="translate(824, 108)">
                <rect width="159" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="79" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">My Projects</text>
            </g>
            
    

    <!-- Character Subheader Bar -->
    <g transform="translate(80, 210)">
        <g transform="translate(0, 0)">
            <circle cx="16" cy="14" r="6" fill="none" stroke="#38bdf8" stroke-width="2"/>
            <path d="M7 28 C7 21 25 21 25 28" fill="none" stroke="#38bdf8" stroke-width="2"/>
            <text x="36" y="20" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="bold" letter-spacing="0.5">CHARACTER</text>
        </g>
        <text x="1760" y="20" text-anchor="end" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14">
            <tspan fill="#cbd5e1">2 Karakter Terdaftar</tspan> • Aktif: <tspan fill="#38bdf8" font-weight="bold">Lin Chen</tspan>
        </text>

        <line x1="0" y1="46" x2="1760" y2="46" stroke="#1e293b" stroke-width="1.2"/>

        <text x="0" y="80" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Pilih Karakter untuk Dikelola:</text>
        <text x="1760" y="80" text-anchor="end" fill="#64748b" font-family="Inter, sans-serif" font-size="13">Karakter otomatis diselaraskan antar scene</text>

        <!-- Character Selector Pills -->
        <g transform="translate(0, 104)">
            <!-- Lin Chen (Selected) -->
            <rect width="210" height="46" rx="12" fill="#0f2647" stroke="#38bdf8" stroke-width="1.8"/>
            <text x="24" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Lin Chen</text>
            <rect x="96" y="12" width="72" height="22" rx="6" fill="#1e3a8a"/>
            <text x="132" y="27" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">5 Scene</text>
            <text x="188" y="28" fill="#94a3b8" font-family="sans-serif" font-size="14">✕</text>

            <!-- Gu Yanzheng -->
            <rect x="226" y="0" width="230" height="46" rx="12" fill="#0b1329" stroke="#334155" stroke-width="1.2"/>
            <text x="250" y="28" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="15" font-weight="500">Gu Yanzheng</text>
            <rect x="362" y="12" width="72" height="22" rx="6" fill="#1e293b"/>
            <text x="398" y="27" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">5 Scene</text>
            <text x="444" y="28" fill="#64748b" font-family="sans-serif" font-size="14">✕</text>

            <!-- + Tambah Karakter -->
            <rect x="472" y="0" width="200" height="46" rx="12" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4"/>
            <text x="572" y="28" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="14" font-weight="bold">+ + Tambah Karakter</text>
        </g>
    </g>

    <!-- Character Profile Main Container -->
    <g transform="translate(80, 410)">
        <rect width="1760" height="610" rx="20" fill="#080e1e" stroke="#1e293b" stroke-width="1.5" filter="url(#card_shadow)"/>

        <!-- Profile Header -->
        <g transform="translate(40, 36)">
            <text x="0" y="0" fill="#38bdf8" font-family="Inter, sans-serif" font-size="18" font-weight="bold" letter-spacing="1">CHARACTER PROFILE</text>
            <text x="0" y="24" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Edit informasi dasar, penampilan, dan pakaian karakter Lin Chen.</text>

            <rect x="1510" y="-14" width="170" height="44" rx="10" fill="url(#blue_btn_grad)"/>
            <text x="1595" y="13" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="600">✓ Save Character</text>
        </g>

        <!-- Section 1: Basic Info -->
        <g transform="translate(40, 120)">
            <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
            <text x="20" y="10" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14" font-weight="bold">1. BASIC INFO</text>

            <!-- Field: Name -->
            <g transform="translate(0, 32)">
                <text x="0" y="0" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Name</text>
                <rect x="0" y="10" width="540" height="50" rx="10" fill="#050914" stroke="#334155" stroke-width="1"/>
                <text x="20" y="41" fill="#ffffff" font-family="Inter, sans-serif" font-size="15">Lin Chen</text>
            </g>

            <!-- Field: Age -->
            <g transform="translate(565, 32)">
                <text x="0" y="0" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Age</text>
                <rect x="0" y="10" width="540" height="50" rx="10" fill="#050914" stroke="#334155" stroke-width="1"/>
                <text x="20" y="41" fill="#ffffff" font-family="Inter, sans-serif" font-size="15">25 tahun</text>
            </g>

            <!-- Field: Gender -->
            <g transform="translate(1130, 32)">
                <text x="0" y="0" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Gender</text>
                <rect x="0" y="10" width="550" height="50" rx="10" fill="#050914" stroke="#334155" stroke-width="1"/>
                <text x="20" y="41" fill="#ffffff" font-family="Inter, sans-serif" font-size="15">Perempuan</text>
            </g>
        </g>

        <!-- Section 2: Appearance -->
        <g transform="translate(40, 260)">
            <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
            <text x="20" y="10" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14" font-weight="bold">2. APPEARANCE</text>

            <!-- Field: Face Shape -->
            <g transform="translate(0, 32)">
                <text x="0" y="0" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Face shape</text>
                <rect x="0" y="10" width="540" height="50" rx="10" fill="#050914" stroke="#334155" stroke-width="1"/>
                <text x="20" y="41" fill="#ffffff" font-family="Inter, sans-serif" font-size="15">refined oval face with defined jawline</text>
            </g>

            <!-- Field: Facial Features -->
            <g transform="translate(565, 32)">
                <text x="0" y="0" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Facial features</text>
                <rect x="0" y="10" width="540" height="50" rx="10" fill="#050914" stroke="#334155" stroke-width="1"/>
                <text x="20" y="41" fill="#ffffff" font-family="Inter, sans-serif" font-size="14">Tatapan analitis penuh ketenangan dan ketegasan martabat</text>
            </g>

            <!-- Field: Skin Tone -->
            <g transform="translate(1130, 32)">
                <text x="0" y="0" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Skin tone</text>
                <rect x="0" y="10" width="550" height="50" rx="10" fill="#050914" stroke="#334155" stroke-width="1"/>
                <text x="20" y="41" fill="#ffffff" font-family="Inter, sans-serif" font-size="15">fair porcelain skin tone</text>
            </g>
        </g>
    </g>
    </svg>