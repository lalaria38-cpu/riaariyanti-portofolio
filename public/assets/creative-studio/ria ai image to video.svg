<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    
    <defs>
        <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#040711"/>
            <stop offset="50%" stop-color="#070b18"/>
            <stop offset="100%" stop-color="#02040a"/>
        </linearGradient>
        <linearGradient id="blue_btn_grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
        <linearGradient id="flow_btn_grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
        <linearGradient id="asmr_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#022c22" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="pov_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#581c87" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#2e1065" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="sejarah_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#78350f" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#451a03" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="edukasi_grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#172554" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="card_shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
        <filter id="glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <rect width="1920" height="1080" fill="url(#bg_grad)"/>
    
    <!-- Application Header Container -->
    <rect x="0" y="0" width="1920" height="174" fill="#050814"/>
    <line x1="0" y1="174" x2="1920" y2="174" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Left Logo & Branding -->
    <g transform="translate(80, 26)">
        <circle cx="30" cy="30" r="26" fill="#090e1e" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="30" cy="30" r="20" fill="#1e1b4b"/>
        <text x="30" y="36" text-anchor="middle" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold">RIA</text>
        <text x="74" y="24" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="800" letter-spacing="0.5">CREATIVE STUDIO</text>
        <text x="74" y="46" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400">Create What Reality Cannot.</text>
    </g>

    <!-- Right Header Action Controls -->
    <g transform="translate(1380, 26)">
        <rect x="0" y="0" width="126" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="44" y="26" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Project ▾</text>

        <rect x="142" y="0" width="168" height="42" rx="10" fill="url(#blue_btn_grad)"/>
        <text x="226" y="26" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">🔖 Buka Flow ↗</text>

        <rect x="326" y="0" width="150" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="401" y="26" text-anchor="middle" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">📥 Import Flow</text>
    </g>

    
            <g transform="translate(80, 108)">
                <rect width="82" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="41" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Home</text>
            </g>
            
            <g transform="translate(176, 108)">
                <rect width="137" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="68" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Character</text>
            </g>
            
            <g transform="translate(327, 108)">
                <rect width="115" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="57" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Viral 🔥</text>
            </g>
            
            <g transform="translate(456, 108)">
                <rect width="148" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="74" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">Storyboard</text>
            </g>
            
            <g transform="translate(618, 108)">
                <rect width="192" height="42" rx="21" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.8"/>
                <circle cx="20" cy="21" r="4.5" fill="#38bdf8"/>
                <text x="34" y="26" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Image to Video</text>
            </g>
            
            <g transform="translate(824, 108)">
                <rect width="159" height="42" rx="21" fill="#0b1329" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.2"/>
                <text x="79" y="26" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500">My Projects</text>
            </g>
            
    

    <g transform="translate(160, 210)">
        <!-- Top Instruction Card -->
        <rect width="1600" height="60" rx="12" fill="#081b2e" stroke="#0284c7" stroke-width="1"/>
        <circle cx="36" cy="30" r="4" fill="#38bdf8"/>
        <text x="54" y="35" fill="#bae6fd" font-family="Inter, sans-serif" font-size="14">
            Prompt ini mendeskripsikan <tspan fill="#ffffff" font-weight="bold">APA YANG SEBENARNYA TERJADI DI SCENE 05</tspan> beserta dialog yang terkunci pada karakter dan satu pergerakan kamera sinematik.
        </text>

        <!-- Main Prompt Code Block -->
        <g transform="translate(0, 84)">
            <rect width="1600" height="340" rx="16" fill="#070c18" stroke="#1e293b" stroke-width="1.5" filter="url(#card_shadow)"/>
            
            <text x="40" y="54" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="16" font-weight="500">
                Gunakan gambar sebagai referensi, wanita bernama Lin Chen dan pria bernama Gu Yanzheng.
            </text>

            <text x="40" y="110" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="16" line-height="1.6">
                <tspan x="40" dy="0">Lin Chen and Gu Yanzheng stand side by side by the balcony railing holding the newly signed legal</tspan>
                <tspan x="40" dy="28">agreement, exchanging a calm smile of shared triumph and deep peace.</tspan>
            </text>

            <text x="40" y="196" fill="#38bdf8" font-family="Inter, sans-serif" font-size="14" font-weight="bold" letter-spacing="1">
                DIALOGUE &amp; SPEAKER LOCK:
            </text>
            <text x="40" y="226" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="16">
                Lin Chen speaks first in Bahasa Indonesia, using a female voice:
            </text>
            <text x="40" y="258" fill="#fef08a" font-family="Inter, sans-serif" font-size="16" font-style="italic">
                "Setelah melewati begitu banyak badai, semuanya akhirnya tenang..."
            </text>

            <!-- Scrollbar track representation -->
            <rect x="1582" y="12" width="6" height="316" rx="3" fill="#1e293b"/>
            <rect x="1582" y="20" width="6" height="120" rx="3" fill="#475569"/>
        </g>

        <!-- Actions Bar -->
        <g transform="translate(0, 450)">
            <!-- Copy Prompt Button -->
            <rect width="280" height="64" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
            <text x="140" y="38" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="15" font-weight="bold">❐ COPY PROMPT</text>

            <!-- Buka di Flow Button -->
            <rect x="1160" y="0" width="440" height="64" rx="14" fill="url(#flow_btn_grad)" filter="url(#glow_cyan)"/>
            <text x="1380" y="38" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="17" font-weight="bold">✨ BUKA DI FLOW ↗</text>
        </g>

        <!-- Guided Steps Box -->
        <g transform="translate(0, 540)">
            <rect width="1600" height="100" rx="14" fill="#081020" stroke="#1e293b" stroke-width="1"/>
            <circle cx="36" cy="36" r="4" fill="#38bdf8"/>
            <text x="54" y="38" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13.5" line-height="1.6">
                <tspan fill="#38bdf8" font-weight="bold">Alur Mandiri Google Flow:</tspan> Klik <tspan fill="#ffffff" font-weight="bold">“BUKA DI FLOW”</tspan> untuk otomatis menyalin prompt video ini dan membuka Flow di tab baru. Gunakan gambar Starting Frame di
            </text>
            <text x="54" y="64" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13.5">
                Section 1 sebagai visual start frame pada Flow. Setelah render selesai di akun Flow Anda, unduh MP4 dan klik <tspan fill="#ffffff" font-weight="bold">“Import Video”</tspan> untuk memuat hasilnya.
            </text>
        </g>
    </g>
    </svg>